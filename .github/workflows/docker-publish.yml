name: Build & Push Docker Images

# 当推送到 main 分支且相关文件有变更时自动触发
on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'blog/**'
      - 'admin/**'
      - 'proxy.js'
      - 'Dockerfile'
      - 'package.json'
      - '.github/workflows/docker-publish.yml'
  # 也允许手动触发（在 GitHub Actions 页面点 Run workflow）
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      # 4 个镜像并行构建，互不阻塞
      matrix:
        include:
          - image: aurora-blog-api
            context: ./api
          - image: aurora-blog-blog
            context: ./blog
          - image: aurora-blog-admin
            context: ./admin
          - image: aurora-blog-proxy
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest
          # GitHub Actions 缓存，加速二次构建
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
