services:
  api:
    build: ./api
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - JWT_SECRET=aurora-secret-key-2026
    volumes:
      - api-uploads:/app/uploads
      - api-db:/app/prisma
    restart: unless-stopped

  blog:
    build: ./blog
    ports:
      - "3000:3000"
    environment:
      - INTERNAL_API_URL=http://api:3002
    depends_on:
      - api
    restart: unless-stopped

  admin:
    build: ./admin
    ports:
      - "5174:5174"
    restart: unless-stopped

  proxy:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PROXY_PORT=8080
      - API_TARGET=http://api:3002
      - BLOG_TARGET=http://blog:3000
      - ADMIN_TARGET=http://admin:5174
    depends_on:
      - api
      - blog
      - admin
    restart: unless-stopped

volumes:
  api-uploads:
  api-db:
